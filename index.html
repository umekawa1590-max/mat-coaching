<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAT COACHING</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:#f3f5f8;color:#222;
}
header{
  background:#172b4d;color:white;padding:18px;
  text-align:center;font-weight:bold;font-size:22px;
}
main{max-width:1100px;margin:auto;padding:18px}
button{
  border:none;border-radius:10px;padding:12px 16px;
  font-size:15px;font-weight:bold;cursor:pointer;
  background:#244b80;color:white;margin:3px;
}
button.secondary{background:#e4e8ef;color:#222}
button.danger{background:#c0392b}
button.green{background:#21865b}
button:active{opacity:.7}
input,select,textarea{
  padding:10px;border:1px solid #ccd3df;border-radius:8px;
  font-size:16px;width:100%;margin:5px 0;
}
textarea{min-height:90px}
.panel{
  background:white;border-radius:16px;padding:18px;
  margin-bottom:16px;box-shadow:0 3px 12px #00000008;
}
.hidden{display:none!important}
h2{font-size:20px;margin-top:0}
h3{font-size:17px}
.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}
.skill{
  background:white;color:#222;border:2px solid #e1e6ef;
  padding:18px;text-align:left;border-radius:12px;
  min-height:80px;
}
.skill:hover{border-color:#244b80}
.skill small{display:block;color:#667085;margin-top:8px}
.video-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.video-box{
  background:#111;border-radius:12px;overflow:hidden;
  min-width:0;
}
video{
  width:100%;display:block;max-height:65vh;background:#000;
}
.video-title{
  color:white;background:#26364d;padding:12px;font-weight:bold;
}
.controls{
  display:flex;flex-wrap:wrap;gap:5px;align-items:center;
}
.controls button{flex:1;min-width:70px}
.small{font-size:13px;color:#667085}
.badge{
  background:#eef3fa;border-radius:8px;padding:6px 10px;
  display:inline-block;margin:4px;
}
.observation{
  border:1px solid #e0e5ec;border-radius:12px;padding:12px;
  margin-bottom:10px;
}
.observation select{max-width:300px}
.start-row{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.start-row label{font-size:13px;font-weight:bold}
footer{text-align:center;color:#888;padding:30px}
@media(max-width:700px){
  .video-grid{grid-template-columns:1fr}
  .start-row{grid-template-columns:1fr}
  main{padding:10px}
}
</style>
</head>

<body>

<header>MAT COACHING</header>

<main>

<!-- HOME -->
<section id="home">

<div class="panel">
  <h2>マット運動 動作分析</h2>
  <p>お手本と自分の動きを比較し、動作の改善を目指そう。</p>

  <label>名前</label>
  <input id="studentName" placeholder="名前を入力">

  <button onclick="saveName()">名前を登録</button>
</div>

<div class="panel">
  <h2>技を選択</h2>
  <div id="skillGrid" class="grid"></div>
</div>

<div class="panel">
  <button class="secondary" onclick="showHistory()">学習履歴</button>
  <button class="secondary" onclick="teacherLogin()">先生ページ</button>
</div>

</section>

<!-- ANALYSIS -->
<section id="analysis" class="hidden">

<div class="panel">
  <button class="secondary" onclick="goHome()">← 技選択へ戻る</button>
  <h2 id="currentSkillTitle"></h2>
  <p id="currentStudent"></p>
</div>

<div class="panel">

<h2>動画の準備</h2>

<div class="grid">

<div>
  <h3>お手本動画</h3>
  <input type="file" accept="video/*" id="refUpload">
  <select id="refSelect">
    <option value="">登録済みのお手本を選択</option>
  </select>
</div>

<div>
  <h3>自分の動画</h3>
  <input type="file" accept="video/*" id="myUpload">
</div>

</div>

</div>

<!-- PLAYBACK CONTROLS DIRECTLY ABOVE VIDEO GRID -->
<div class="panel" id="playbackPanel">

<h2>同時再生コントロール</h2>

<div class="start-row">

<div>
<label>お手本動画 開始位置（秒）</label>
<input type="number" id="refStart" value="0" min="0" step="0.1">
<button class="secondary" onclick="setStartFromCurrent('ref')">
現在位置を開始位置に設定
</button>
</div>

<div>
<label>自分の動画 開始位置（秒）</label>
<input type="number" id="myStart" value="0" min="0" step="0.1">
<button class="secondary" onclick="setStartFromCurrent('my')">
現在位置を開始位置に設定
</button>
</div>

</div>

<div class="controls" style="margin-top:12px">
<button class="green" onclick="playBoth()">▶ 同時再生</button>
<button onclick="pauseBoth()">⏸ 同時停止</button>
<button onclick="stepBoth(-1)">◀ 1秒</button>
<button onclick="stepBoth(1)">1秒 ▶</button>
<button class="secondary" onclick="resetBoth()">開始位置に戻る</button>
</div>

<div style="margin-top:15px">
<label>再生速度</label>
<select id="playSpeed" onchange="changeSpeed()">
<option value="0.25">0.25倍</option>
<option value="0.5">0.5倍</option>
<option value="0.75">0.75倍</option>
<option value="1" selected>1倍</option>
<option value="1.25">1.25倍</option>
<option value="1.5">1.5倍</option>
<option value="2">2倍</option>
</select>
</div>

<div style="margin-top:12px">
<label>比較再生位置</label>
<input type="range" id="syncSeek" min="0" max="1000" value="0"
oninput="seekBoth(this.value)">
<p class="small" id="syncStatus">動画を読み込んでください。</p>
</div>

</div>

<!-- VIDEO GRID -->
<div class="video-grid">

<div class="video-box">
<div class="video-title">お手本</div>
<video id="refVideo" playsinline controls></video>
</div>

<div class="video-box">
<div class="video-title">自分の動き</div>
<video id="myVideo" playsinline controls></video>
</div>

</div>

<div class="panel" style="margin-top:16px">
<h2>個別操作</h2>

<div class="grid">

<div>
<h3>お手本動画</h3>
<div class="controls">
<button class="secondary" onclick="individualPlay('ref')">再生</button>
<button class="secondary" onclick="individualPause('ref')">停止</button>
<button class="secondary" onclick="individualStep('ref',-1)">−1秒</button>
<button class="secondary" onclick="individualStep('ref',1)">＋1秒</button>
</div>
</div>

<div>
<h3>自分の動画</h3>
<div class="controls">
<button class="secondary" onclick="individualPlay('my')">再生</button>
<button class="secondary" onclick="individualPause('my')">停止</button>
<button class="secondary" onclick="individualStep('my',-1)">−1秒</button>
<button class="secondary" onclick="individualStep('my',1)">＋1秒</button>
</div>
</div>

</div>
</div>

<!-- ANALYSIS ADVICE -->
<div class="panel">

<h2>動作の振り返り</h2>

<p>
お手本と自分の動きを見比べて、各項目を選択してください。
選択した内容から改善のアドバイスを生成します。
</p>

<div id="observationList"></div>

<h3>気づいたこと</h3>
<textarea id="studentMemo" placeholder="自分の動きで気づいたこと、意識したことなど"></textarea>

<button class="green" onclick="generateAdvice()">動作分析アドバイスを生成</button>

<div id="adviceResult" style="margin-top:16px"></div>

</div>

<div class="panel">
<h2>学習記録</h2>
<button onclick="saveRecord()">今日の練習を保存</button>
<button class="secondary" onclick="showHistory()">記録を見る</button>
</div>

</section>

<!-- HISTORY -->
<section id="history" class="hidden">

<div class="panel">
<button class="secondary" onclick="goHome()">← 戻る</button>
<h2>学習履歴</h2>
<div id="historyList"></div>
<button class="danger" onclick="clearHistory()">履歴を削除</button>
</div>

</section>

<!-- TEACHER -->
<section id="teacher" class="hidden">

<div class="panel">
<button class="secondary" onclick="goHome()">← 戻る</button>
<h2>先生ページ</h2>

<h3>お手本動画登録</h3>
<label>技名</label>
<select id="teacherSkill"></select>

<label>動画名</label>
<input id="refName" placeholder="動画の名前">

<label>動画ファイル</label>
<input id="teacherVideo" type="file" accept="video/*">

<button class="green" onclick="registerReference()">お手本を登録</button>

<h3>登録済み動画</h3>
<div id="registeredRefs"></div>

<hr>

<h3>技の追加</h3>
<input id="newSkillName" placeholder="技名">
<input id="newSkillGroup" placeholder="技の系統">
<button onclick="addSkill()">技を追加</button>

<hr>

<h3>先生用パスワード</h3>
<input id="newPin" type="password" placeholder="新しいPIN">
<button onclick="changePin()">PINを変更</button>

</div>

</section>

<!-- CAMERA -->
<section id="camera" class="hidden">

<div class="panel">
<button class="secondary" onclick="goHome()">← 戻る</button>
<h2>カメラ撮影</h2>

<video id="cameraVideo" autoplay playsinline></video>

<div class="controls">
<button onclick="startCamera()">カメラ起動</button>
<button onclick="switchCamera()">カメラ切替</button>
<button class="green" onclick="startRecording()">録画開始</button>
<button class="danger" onclick="stopRecording()">録画停止</button>
</div>

<div id="cameraStatus"></div>

</div>

</section>

</main>

<footer>MAT COACHING</footer>

<script>

/* ==============================
   TECHNIQUES
============================== */

const DEFAULT_TECHS=[
["前転","回転系：接転技群"],
["開脚前転","回転系：接転技群"],
["倒立前転","回転系：接転技群"],
["伸膝前転","回転系：接転技群"],
["跳び前転","回転系：接転技群"],
["後転","回転系：接転技群"],
["開脚後転","回転系：接転技群"],
["伸膝後転","回転系：接転技群"],
["後転倒立","回転系：接転技群"],
["側方倒立回転","回転系：ほん転技群"],
["倒立ブリッジ","回転系：ほん転技群"],
["側方倒立回転跳び1/4ひねり（ロンダート）","回転系：ほん転技群"],
["前方倒立回転","回転系：ほん転技群"],
["前方倒立回転跳び","回転系：ほん転技群"],
["頭はねおき","回転系：ほん転技群"],
["片足平均立ち","巧技系：平均立ち技群"],
["片足正面水平立ち","巧技系：平均立ち技群"],
["片足側面水平立ち","巧技系：平均立ち技群"],
["Y字バランス","巧技系：平均立ち技群"],
["倒立","巧技系：倒立"],
["倒立ひねり","巧技系：倒立"],
["頭倒立","巧技系：倒立"],
["補助倒立","巧技系：倒立"],
["補助倒立前転","その他・系統性を踏まえた技"]
];

let techniques=JSON.parse(localStorage.getItem("techniques")||"null")||DEFAULT_TECHS;
let currentSkill="";
let student="";
let syncPlaying=false;
let rafId=null;
let cameraStream=null;
let mediaRecorder=null;
let recordedChunks=[];
let cameraFacing="environment";

const refVideo=document.getElementById("refVideo");
const myVideo=document.getElementById("myVideo");

/* ==============================
   STORAGE
============================== */

function saveName(){
 student=document.getElementById("studentName").value.trim();
 localStorage.setItem("studentName",student);
 alert("名前を登録しました");
}

function loadName(){
 student=localStorage.getItem("studentName")||"";
 document.getElementById("studentName").value=student;
}

function getRefs(){
 return JSON.parse(localStorage.getItem("matRefs")||"[]");
}

function saveRefs(data){
 localStorage.setItem("matRefs",JSON.stringify(data));
}

function getHistory(){
 return JSON.parse(localStorage.getItem("matHistory")||"[]");
}

/* ==============================
   HOME
============================== */

function renderSkills(){
 const grid=document.getElementById("skillGrid");
 grid.innerHTML="";

 techniques.forEach(t=>{
  const b=document.createElement("button");
  b.className="skill";
  b.innerHTML=`${escapeHTML(t[0])}<small>${escapeHTML(t[1])}</small>`;
  b.onclick=()=>selectSkill(t[0]);
  grid.appendChild(b);
 });
}

function selectSkill(skill){
 currentSkill=skill;
 document.getElementById("currentSkillTitle").textContent=skill;
 document.getElementById("currentStudent").textContent=
 student?student+" さん":"名前未登録";
 document.getElementById("teacherSkill").innerHTML="";
 techniques.forEach(t=>{
  let o=document.createElement("option");
  o.value=t[0];o.textContent=t[0];
  document.getElementById("teacherSkill").appendChild(o);
 });
 document.getElementById("teacherSkill").value=skill;
 renderObservations();
 updateRefSelect();
 showSection("analysis");
}

function goHome(){
 stopBoth();
 stopCamera();
 showSection("home");
}

function showSection(id){
 ["home","analysis","history","teacher","camera"].forEach(s=>{
  document.getElementById(s).classList.add("hidden");
 });
 document.getElementById(id).classList.remove("hidden");
}

function escapeHTML(str){
 return String(str).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

/* ==============================
   VIDEO LOADING
============================== */

document.getElementById("refUpload").addEventListener("change",e=>{
 loadVideoFile(e.target.files[0],refVideo);
});

document.getElementById("myUpload").addEventListener("change",e=>{
 loadVideoFile(e.target.files[0],myVideo);
});

function loadVideoFile(file,video){
 if(!file)return;
 video.src=URL.createObjectURL(file);
 video.load();
 video.onloadedmetadata=()=>{
  updateStatus();
 };
}

function updateRefSelect(){
 const sel=document.getElementById("refSelect");
 sel.innerHTML='<option value="">登録済みのお手本を選択</option>';
 getRefs().filter(r=>r.skill===currentSkill).forEach((r,i)=>{
  let o=document.createElement("option");
  o.value=i;
  o.textContent=r.name;
  sel.appendChild(o);
 });
}

document.getElementById("refSelect").addEventListener("change",e=>{
 const index=e.target.value;
 if(index==="")return;
 const list=getRefs().filter(r=>r.skill===currentSkill);
 const item=list[index];
 if(item){
  refVideo.src=item.url;
  refVideo.load();
 }
});

/* ==============================
   SYNCHRONIZED PLAYBACK
============================== */

function getStart(v){
 const input=document.getElementById(v==="ref"?"refStart":"myStart");
 return Math.max(0,Number(input.value)||0);
}

function setStartFromCurrent(which){
 const v=which==="ref"?refVideo:myVideo;
 document.getElementById(which==="ref"?"refStart":"myStart").value=
  v.currentTime.toFixed(1);
}

function stopBoth(){
 syncPlaying=false;
 if(rafId!==null){
  cancelAnimationFrame(rafId);
  rafId=null;
 }
 refVideo.pause();
 myVideo.pause();
}

function pauseBoth(){
 stopBoth();
 updateStatus();
}

async function playBoth(){

 if(!refVideo.src||!myVideo.src){
  alert("お手本動画と自分の動画を読み込んでください");
  return;
 }

 stopBoth();

 const rs=getStart("ref");
 const ms=getStart("my");

 await Promise.all([
  ensureReady(refVideo),
  ensureReady(myVideo)
 ]);

 refVideo.currentTime=Math.min(rs,refVideo.duration||rs);
 myVideo.currentTime=Math.min(ms,myVideo.duration||ms);

 const speed=Number(document.getElementById("playSpeed").value);
 refVideo.playbackRate=speed;
 myVideo.playbackRate=speed;

 try{
  await Promise.all([refVideo.play(),myVideo.play()]);
 }catch(e){
  pauseBoth();
  alert("動画の再生を開始できませんでした");
  return;
 }

 syncPlaying=true;
 syncLoop();
}

function ensureReady(v){
 return new Promise(resolve=>{
  if(v.readyState>=2)return resolve();
  v.addEventListener("loadeddata",resolve,{once:true});
  v.addEventListener("error",resolve,{once:true});
 });
}

function syncLoop(){

 if(!syncPlaying)return;

 if(refVideo.paused||myVideo.paused){
  stopBoth();
  return;
 }

 const rs=getStart("ref");
 const ms=getStart("my");

 const elapsed=refVideo.currentTime-rs;
 const expected=ms+elapsed;

 if(Math.abs(myVideo.currentTime-expected)>0.08){
  if(expected>=0&&expected<myVideo.duration){
   myVideo.currentTime=expected;
  }
 }

 if(refVideo.ended||myVideo.ended||
    refVideo.currentTime>=refVideo.duration||
    myVideo.currentTime>=myVideo.duration){
  stopBoth();
  updateStatus();
  return;
 }

 updateStatus();
 rafId=requestAnimationFrame(syncLoop);
}

function resetBoth(){
 stopBoth();
 refVideo.currentTime=Math.min(getStart("ref"),refVideo.duration||0);
 myVideo.currentTime=Math.min(getStart("my"),myVideo.duration||0);
 updateStatus();
}

function stepBoth(sec){
 stopBoth();
 refVideo.currentTime=Math.max(0,Math.min(refVideo.duration||0,refVideo.currentTime+sec));
 myVideo.currentTime=Math.max(0,Math.min(myVideo.duration||0,myVideo.currentTime+sec));
 updateStatus();
}

function individualPlay(which){
 stopBoth();
 (which==="ref"?refVideo:myVideo).play();
}

function individualPause(which){
 (which==="ref"?refVideo:myVideo).pause();
}

function individualStep(which,sec){
 stopBoth();
 const v=which==="ref"?refVideo:myVideo;
 v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+sec));
 updateStatus();
}

function changeSpeed(){
 const speed=Number(document.getElementById("playSpeed").value);
 refVideo.playbackRate=speed;
 myVideo.playbackRate=speed;
}

function seekBoth(value){
 stopBoth();
 const ratio=Number(value)/1000;
 const rs=getStart("ref");
 const ms=getStart("my");

 const refRemaining=Math.max(0,(refVideo.duration||0)-rs);
 const myRemaining=Math.max(0,(myVideo.duration||0)-ms);
 const common=Math.min(refRemaining,myRemaining);

 refVideo.currentTime=Math.min(refVideo.duration||0,rs+ratio*common);
 myVideo.currentTime=Math.min(myVideo.duration||0,ms+ratio*common);
 updateStatus();
}

function updateStatus(){
 const r=refVideo.currentTime||0;
 const m=myVideo.currentTime||0;
 document.getElementById("syncStatus").textContent=
 `お手本 ${r.toFixed(2)}秒 / 自分 ${m.toFixed(2)}秒`;
}

refVideo.addEventListener("timeupdate",updateStatus);
myVideo.addEventListener("timeupdate",updateStatus);
refVideo.addEventListener("ended",pauseBoth);
myVideo.addEventListener("ended",pauseBoth);

/* ==============================
   OBSERVATION
============================== */

const observationItems=[
 "体の形・姿勢",
 "手の位置・つき方",
 "足の動き・開き方",
 "回転・移動のタイミング",
 "着地・バランス",
 "動きのリズム"
];

function renderObservations(){
 const root=document.getElementById("observationList");
 root.innerHTML="";

 observationItems.forEach((item,i)=>{
  const div=document.createElement("div");
  div.className="observation";
  div.innerHTML=`
   <strong>${escapeHTML(item)}</strong>
   <select id="obs${i}">
    <option value="unknown">判断できない</option>
    <option value="match">お手本に近い</option>
    <option value="diff">違いがある</option>
   </select>
   <textarea id="obsNote${i}" placeholder="具体的な違い・気づき（任意）"></textarea>
  `;
  root.appendChild(div);
 });
}

const adviceMap={
 "前転":"あごを引き、背中を丸めながら回転することを意識しましょう。手をつく位置と回転後の立ち上がりも確認しましょう。",
 "開脚前転":"回転の途中から脚を左右に開き、手でマットを押しながら立ち上がる動きを確認しましょう。",
 "倒立前転":"倒立姿勢で体を伸ばすことと、前転へ移行するタイミングを意識しましょう。",
 "伸膝前転":"膝を伸ばした状態を保ち、回転後に脚を前方へ伸ばして立ち上がることを意識しましょう。",
 "跳び前転":"踏み切りから手をつくまでの身体の伸びと、着地後の姿勢を確認しましょう。",
 "後転":"手を耳の横に置き、腕でマットを押す動きと回転の勢いを確認しましょう。",
 "開脚後転":"後転中に脚を開くタイミングと、手で押して立ち上がる動きを確認しましょう。",
 "伸膝後転":"脚を伸ばした状態で回転し、手でマットを押すタイミングを意識しましょう。",
 "後転倒立":"後転から倒立へ移行する際の腰の伸びと、手で押す力を確認しましょう。",
 "側方倒立回転":"手をつく位置、脚の振り上げ、腰の高さ、着地時の脚の開きを確認しましょう。",
 "倒立ブリッジ":"倒立からブリッジへ移行する際の肩の開きと、腰の反りを確認しましょう。",
 "側方倒立回転跳び1/4ひねり（ロンダート）":"手をつく位置、脚をそろえるタイミング、ひねりと着地の方向を確認しましょう。",
 "前方倒立回転":"踏み切り、手をつく位置、肩の押し、着地時の身体の伸びを確認しましょう。",
 "前方倒立回転跳び":"踏み切りの強さ、手で押す動き、空中での身体の伸びを確認しましょう。",
 "頭はねおき":"頭や肩で支える局面と、腰・脚を持ち上げる動きの連動を確認しましょう。",
 "片足平均立ち":"支持脚の安定と、上体・腕・自由脚のバランスを意識しましょう。",
 "片足正面水平立ち":"支持脚を安定させ、自由脚と上体を水平に保つことを意識しましょう。",
 "片足側面水平立ち":"横方向への上体と脚の伸び、支持脚の安定を確認しましょう。",
 "Y字バランス":"支持脚の膝と足首を安定させ、自由脚を無理なく伸ばしましょう。",
 "倒立":"手の位置、肩の押し、腰の位置、脚の伸びを確認しましょう。",
 "倒立ひねり":"倒立姿勢の安定と、ひねりを行うタイミングを確認しましょう。",
 "頭倒立":"頭と手の支持位置、腰の位置、脚の伸びを確認しましょう。",
 "補助倒立":"補助を受けながら肩・腰・脚を一直線にする感覚を確認しましょう。",
 "補助倒立前転":"倒立姿勢から前転へ移行するタイミングと、補助の使い方を確認しましょう."
};

function generateAdvice(){

 const results=[];
 const matches=[];
 const diffs=[];

 observationItems.forEach((item,i)=>{
  const val=document.getElementById("obs"+i).value;
  const note=document.getElementById("obsNote"+i).value.trim();

  if(val==="match")matches.push(item);
  if(val==="diff")diffs.push({item,note});
 });

 let html="<h3>振り返り結果</h3>";

 if(matches.length){
  html+="<h3>できている点</h3><ul>";
  matches.forEach(m=>html+=`<li>${escapeHTML(m)}：お手本に近いと自己評価できました。</li>`);
  html+="</ul>";
 }else{
  html+="<p>できている点も、動画を見返して探してみましょう。</p>";
 }

 if(diffs.length){
  html+="<h3>改善ポイント</h3>";

  diffs.forEach(d=>{
   html+=`<div class="observation">
    <strong>${escapeHTML(d.item)}</strong>
    <p>${escapeHTML(d.note||"この項目について、お手本と自分の動きを見比べてみましょう。")}</p>
   </div>`;
  });

  html+="<h3>練習アドバイス</h3><ul>";

  diffs.forEach(d=>{
   let tip="お手本の動きと比較し、動作のタイミングや身体の位置を確認しましょう。";
   if(d.item.includes("姿勢"))tip="身体の形を意識し、動作の途中でも姿勢が崩れないように練習しましょう。";
   if(d.item.includes("手"))tip="手の位置と手でマットを押すタイミングを確認しましょう。";
   if(d.item.includes("足"))tip="脚の位置、開き方、伸ばすタイミングを意識しましょう。";
   if(d.item.includes("回転"))tip="動作の順序とタイミングを確認し、部分練習から取り組みましょう。";
   if(d.item.includes("着地"))tip="着地時に姿勢を安定させ、バランスを保つ練習をしましょう。";
   if(d.item.includes("リズム"))tip="動作を急がず、各局面のタイミングを一定にすることを意識しましょう。";
   html+=`<li>${escapeHTML(tip)}</li>`;
  });

  html+="</ul>";

 }else{
  html+="<p>違いがある項目はありません。判断できない項目をもう一度見比べてみましょう。</p>";
 }

 const skillTip=adviceMap[currentSkill]||
 "基本姿勢、身体の伸び、動作のタイミング、終末姿勢を確認しましょう。";

 html+=`<h3>${escapeHTML(currentSkill)}のポイント</h3><p>${escapeHTML(skillTip)}</p>`;

 const memo=document.getElementById("studentMemo").value.trim();
 if(memo){
  html+=`<h3>自分の気づき</h3><p>${escapeHTML(memo)}</p>`;
 }

 html+=`
 <hr>
 <p class="small">
 このアドバイスは、選択した観察項目と技の基本ポイントをもとに生成しています。
 動画を自動認識するAIや骨格検知による分析ではありません。
 </p>
 `;

 document.getElementById("adviceResult").innerHTML=html;
}

 }else{

   d.className="observation";
   d.innerHTML=`

 showSection("history");
}

}

function registerReference(){
 const file=document.getElementById("teacherVideo").files[0];
 const skill=document.getElementById("teacherSkill").value;
 const name=document.getElementById("refName").value.trim();

 if(!file){
  alert("動画を選択してください");
  return;
 }

 const refs=getRefs();
 refs.push({
  name:name||file.name,
  skill,
  url:URL.createObjectURL(file),
  fileName:file.name
 });

 saveRefs(refs);
 renderRegisteredRefs();

 alert("登録しました");
}

/*
  この簡易版の登録動画はブラウザ内の一時URLで扱います。
  ページを閉じた後も動画を保持するにはIndexedDB等が必要です。
*/

function renderRegisteredRefs(){
 const root=document.getElementById("registeredRefs");
 root.innerHTML="";

 getRefs().forEach((r,i)=>{
  const d=document.createElement("div");
  d.className="observation";
  d.innerHTML=`
   <strong>${escapeHTML(r.name)}</strong>
   <p>${escapeHTML(r.skill)}</p>
   <button class="danger" onclick="deleteRef(${i})">削除</button>
  `;
  root.appendChild(d);
 });
}

function deleteRef(i){
 const refs=getRefs();
 refs.splice(i,1);
 saveRefs(refs);
 renderRegisteredRefs();
 updateRefSelect();
}

async function startCamera(){

 stopCamera();

 try{
  cameraStream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:cameraFacing},
   audio:true
  });

  document.getElementById("cameraVideo").srcObject=cameraStream;
  document.getElementById("cameraStatus").textContent="カメラ起動中";
 }catch(e){
  alert("カメラを起動できませんでした。ブラウザのアクセス許可を確認してください。");
 }
}

async function switchCamera(){
 cameraFacing=cameraFacing==="environment"?"user":"environment";
 await startCamera();
}

function startRecording(){

 if(!cameraStream){
  alert("先にカメラを起動してください");
  return;
 }

 recordedChunks=[];

 mediaRecorder=new MediaRecorder(cameraStream);

 mediaRecorder.ondataavailable=e=>{
  if(e.data.size>0)recordedChunks.push(e.data);
 };

 mediaRecorder.onstop=()=>{
  const blob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||"video/webm"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="mat-coaching-video.webm";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
 };

 mediaRecorder.start();
 document.getElementById("cameraStatus").textContent="録画中";
}

function stopRecording(){
 if(mediaRecorder&&mediaRecorder.state!=="inactive"){
  mediaRecorder.stop();
  document.getElementById("cameraStatus").textContent="録画終了";
 }
}

function stopCamera(){
 if(cameraStream){
  cameraStream.getTracks().forEach(t=>t.stop());
  cameraStream=null;
 }
}
